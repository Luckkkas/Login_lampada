<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Login da Lâmpada | Luckkkas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>
    <main class="room" id="room">
        <div class="room-light" id="roomLight"></div>
        <div class="fireflies" id="fireflies"></div>

        <section class="lamp-side">
            <div class="lamp-container" id="lampContainer">
                <div class="lamp-glow"></div>
                <div class="lamp-head"></div>
                <div class="light-beam"></div>
                <div class="lamp-stem"></div>
                <div class="lamp-base"></div>
                <div class="desk-surface"></div>

                <svg class="string-svg" aria-hidden="true">
                    <path id="stringPath" d="M 0 0 L 0 80"></path>

                </svg>

                <div class="string-handle" id="stringHandle" aria-label="Puxar a corda da lâmpada"></div>
            </div>
        </section>

        <section class="login-side">
            <form class="glass login-card" id="loginForm" action="">
                <div class="glass-line"></div>

                <div class="login-heading">
                    <h2>Bem-vindo de volta</h2>
                    <p>Digite seus dados para acessar sua conta</p>
                </div>

                <div class="inputs">
                    <label class="input-wrap">
                        <span class="input-icon user-icon" aria-hidden="true">
                        </span>
                        <input type="text" placeholder="Nome de usuário" autocomplete="username">
                    </label>

                    <label class="input-wrap">
                        <span class="input-icon mail-icon" aria-hidden="true">
                        </span>
                        <input type="email" placeholder="Endereço de e-mail" autocomplete="email">
                    </label>

                    <label class="input-wrap">
                        <span class="input-icon lock-icon" aria-hidden="true">
                        </span>
                        <input type="password" placeholder="Senha" autocomplete="current-password">
                    </label>

                    <button class="sign-in" type="submit">Entrar</button>

                    <div class="divider">
                        <span></span>
                        <b>OU CONTINUE COM</b>
                        <span></span>
                    </div>

                    <div class="socials">
                        <button class="social-btn" type="button">
                            <span class="google-icon">G</span> Google
                        </button>
                        <button class="social-btn" type="button">
                            <span class="github-icon">.</span> GitHub
                        </button>

                    </div>
                </div>
            </form>
        </section>

    </main>

</body>
<script src="script.js"></script>

</html>
